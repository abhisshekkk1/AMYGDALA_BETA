version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: amygdala-postgres
    restart: always
    environment:
      POSTGRES_USER: amygdala_user
      POSTGRES_PASSWORD: amygdala_secure_password_2025
      POSTGRES_DB: amygdala_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U amygdala_user -d amygdala_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: amygdala-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://amygdala_user:amygdala_secure_password_2025@db:5432/amygdala_db
      - SECRET_KEY=amygdala-super-secret-key-change-in-production-2025
      - ALGORITHM=HS256
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: amygdala-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
