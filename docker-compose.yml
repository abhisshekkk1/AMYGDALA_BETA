version: "3.9"

services:
  db:
    image: pgvector/pgvector:pg16
    container_name: mentora-postgres
    restart: always
    environment:
      POSTGRES_USER: mentora_user
      POSTGRES_PASSWORD: mentora_secure_password_2025
      POSTGRES_DB: mentora_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mentora_user -d mentora_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mentora-backend
    restart: always
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://mentora_user:mentora_secure_password_2025@db:5432/mentora_db
      - SECRET_KEY=mentora-super-secret-key-change-in-production-2025
      - ALGORITHM=HS256
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GEMINI_API_KEY=${GEMINI_API_KEY}
    ports:
      - "8000:8000"
    volumes:
      - ./backend/storage:/app/storage

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mentora-frontend
    restart: always
    depends_on:
      - backend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000/api/v1
    ports:
      - "3000:3000"

volumes:
  postgres_data:
